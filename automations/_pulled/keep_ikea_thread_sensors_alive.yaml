automation:
- id: '1784743967906'
  alias: Keep IKEA Thread sensors alive
  triggers:
  - trigger: time_pattern
    hours: /2
  actions:
  - repeat:
      for_each:
      - button.timmerflotte_temp_hmd_sensor_identify_1
      - button.timmerflotte_temp_hmd_sensor_identify_1_3
      - button.timmerflotte_temp_hmd_sensor_identify_1_4
      - button.timmerflotte_temp_hmd_sensor_identify_1_5
      - button.babyroom_babyroom_identify_1
      sequence:
      - action: button.press
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
  mode: single
