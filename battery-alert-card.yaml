# Low-battery alert. Renders nothing at all when every battery is healthy.
#
# Deliberately NOT a hardcoded entity list. The batteries here live in IKEA
# Timmerflotte sensors, Bilresa scroll wheels, the Tado TRVs and the Alpstuga
# monitor, and that set grows every time a device is added — a fixed list would
# quietly stop covering new devices, which is the exact failure this card is
# meant to catch. Instead it walks every entity with `device_class: battery`,
# so a new sensor is covered the moment it is paired.
#
# Cost of that choice: iterating `states` makes the template subscribe to all
# state changes rather than a named few. One card on one dashboard is fine, but
# it is why this pattern belongs here and not in ten cards.
#
# Both battery flavours are handled: `sensor` (a percentage) and `binary_sensor`
# (on = low, no number available). Binary ones sort first — they are already
# past their own threshold, so they are more urgent than a 19%.
#
# `ignore` exists because some mains-powered devices still expose a battery
# entity and park it at 0 — the Granary feeder is plugged in and reports 0%,
# which is a bogus value, not a flat battery. Entries are matched as substrings
# against the entity_id, so 'granary' covers every entity that device exposes
# without needing its exact id.
#
# Note this filters by device, NOT by value: a blanket "hide anything reading
# exactly 0" rule would also hide a genuinely dead battery, which is the one
# reading this card most needs to show.
#
# Hiding when empty: an empty marker div is emitted and the style hides the
# ha-card that CONTAINS it. The marker is what makes the rule safe.
#
# A bare `ha-card { display: none }` here is not merely sloppy, it is a bug that
# blanks other cards. hui-card opts out of shadow DOM (createRenderRoot returns
# `this`), so every card in a stack shares the stack's shadow tree, and
# html-template-card has no shadow root of its own — so this <style> reaches
# every sibling card that also lacks one. Cards written as normal LitElements
# keep their ha-card inside their own shadow root and are unaffected, so the
# damage lands squarely on the other html-template-cards on the view: exactly
# the climate table and the water level card.
#
# The card element itself always exists, so the vertical-stack may still leave
# its inter-card gap behind — a few pixels, not a card-sized hole.
#
# Requires html-template-card (HACS).

type: custom:html-template-card
title: ""
ignore_line_breaks: true
content: >
  {% set threshold = 20 %}

  {% set ignore = ['granary'] %}

  {% set ns = namespace(low=[], flagged=[]) %}

  {% for s in states.sensor
       if s.attributes.device_class == 'battery'
       and not ignore | select('in', s.entity_id | lower) | list
       and s.state | is_number
       and s.state | float <= threshold %}
    {% set ns.low = ns.low + [[s.name | replace(' Battery', ''), s.state | float | round(0) | int]] %}
  {% endfor %}

  {% for s in states.binary_sensor
       if s.attributes.device_class == 'battery'
       and not ignore | select('in', s.entity_id | lower) | list
       and s.state == 'on' %}
    {% set ns.flagged = ns.flagged + [[s.name | replace(' Battery', ''), none]] %}
  {% endfor %}

  {% set rows = ns.flagged + (ns.low | sort(attribute='1')) %}

  {% if rows | count == 0 %}
    <div class="bat-empty"></div>
    <style>ha-card:has(.bat-empty) { display: none !important; }</style>
  {% else %}

  <style>
    /* Scoped with :has() and NOT written as a bare `ha-card` selector.
       hui-card opts out of shadow DOM (createRenderRoot returns `this`), so every
       card in a stack renders into the STACK's shadow tree -- and html-template-card
       has no shadow root either, putting this <style> and this card's <ha-card> in
       that shared tree. A bare `ha-card` rule therefore hits every sibling card that
       also lacks its own shadow root, i.e. every other html-template-card on the
       view. Cards built as normal LitElements are immune, which is what makes the
       leak so easy to miss. `:has(.bat-card)` can only ever match this card. */
    ha-card:has(.bat-card) { background: none !important; box-shadow: none !important; border: none !important; }

    .bat-card {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--ha-card-background, var(--card-background-color, #fff));
      border: 1px solid var(--divider-color, #e0e0e0);
      border-left: 3px solid #f0a020;
      border-radius: 14px;
      padding: 9px 13px 10px;
    }

    .bat-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #d98600;
      margin-bottom: 6px;
    }

    .bat-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 0;
    }

    .bat-name {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--primary-text-color, #212121);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bat-val {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      color: #e8a33d;
    }

    /* Under half the threshold is the one you act on today, not this week. */
    .bat-val.crit { color: #e05c4a; }
  </style>


  <div class="bat-card">
    <div class="bat-title">Low battery</div>
    {% for row in rows %}
      <div class="bat-row">
        <span class="bat-name">{{ row[0] }}</span>
        {% if row[1] is none %}
          <span class="bat-val crit">Low</span>
        {% else %}
          <span class="bat-val{% if row[1] <= threshold / 2 %} crit{% endif %}">{{ row[1] }}%</span>
        {% endif %}
      </div>
    {% endfor %}
  </div>

  {% endif %}
