# ─────────────────────────────────────────────────────────────────────────────
# Home Dashboard — phone-first. Four views: Home, Fountain, AdGuard, Buttons.
#
# Merged from the dashboards that used to be separate:
#   dashboard-general  → the Air Quality and Cat Fountain cards
#   dashboard-giacomo  → the Buttons view
# `dashboard-giacomo` itself is NOT managed by this repo and is never written
# to — the Kindle Dashboard view there stays exactly as it is.
#
# LAYOUT: every view is `type: panel`, which renders a single card edge-to-edge
# at full width. Sections views cap each column at 500px and that cap is only
# adjustable from a theme, so panel is how this gets full width with no theme
# and no HACS dependency. Each view therefore holds exactly one vertical-stack
# — a panel view shows only its first card.
#
# Consequence: `grid_options` (columns / rows) is a sections-view feature and
# is ignored here. Multi-column layout inside a panel needs a `grid` card, as
# the Buttons view does, and side margins come from card-mod on each stack —
# panel views have almost none of their own.
#
# Deployed by .github/workflows/deploy-dashboards.yml on every push to main.
# Edit this file, not the HA UI — a deploy overwrites whatever is live.
# See docs/SETUP.md for credentials and docs/ENTITIES.md for the entity list.
#
# Icons are mdi:circle placeholders except where an icon was already chosen in
# the dashboard this content came from — swap them manually.
# ─────────────────────────────────────────────────────────────────────────────

views:
  # ═══════════════════════════════ HOME ═══════════════════════════════
  - title: Home
    path: home
    icon: mdi:circle
    type: panel
    badges:
      - type: entity
        entity: sensor.timmerflotte_temp_hmd_sensor_temperature_4
        name: Living Room
        icon: mdi:circle
        color: red
      - type: entity
        entity: sensor.dockstream_smart_fountain_remaining_water_2
        name: Fountain
        icon: mdi:circle
        color: cyan
      - type: entity
        entity: sensor.alpstuga_air_quality_monitor_carbon_dioxide
        name: CO₂
        icon: mdi:circle
        color: green
    cards:
      # mod-card wraps the stack in an ha-card we can pad, which insets every
      # card inside it. Needed because panel views render edge-to-edge, and
      # card-mod has no handling of its own for stacks or views.
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              background: none;
              border: none;
              box-shadow: none;
              padding: 0 12px;
            }
        card:
          type: vertical-stack
          cards:
            # ──────────────────────────── CLOCK ───────────────────────────
            # Built-in card (no HACS), rendered client-side so it ticks live
            # rather than waiting on a state change. no_background drops the
            # card surface so the time reads as a page header, not a tile.
            - type: clock
              clock_style: digital
              clock_size: medium
              no_background: true

            # ───────────────────────── ATTENTION ──────────────────────────
            # Water leaks, sensors that have stopped reporting, low batteries.
            # Sits high on purpose: it hides itself entirely when nothing is
            # wrong, so it only ever costs space when it has something to say.
            # Everything is discovered by device_class rather than by a fixed
            # entity list — see the card file.
            - !include ../attention-card.yaml

            # ─────────────────────────── CLIMATE ──────────────────────────
            # Room readings are a single table card: room name, temperature and
            # humidity in aligned columns with headers. Edit the room list
            # inside climate-table-card.yaml to add or remove rooms.
            - type: heading
              heading: Climate
              heading_style: title
              icon: mdi:circle
            - !include ../climate-table-card.yaml

            # statistics-graph rather than history-graph. It plots long-term
            # statistics instead of raw recorder states, so `stat_types: [mean]`
            # gives one averaged point per bucket — six sensors on one chart
            # without the sawtooth of every individual state change.
            #
            # `period: 5minute` is 288 points across the day, detailed but
            # already smoothed. Safe at this range: HA keeps 5-minute
            # statistics for recorder's purge_keep_days (10 by default) and
            # hourly statistics forever, so widening days_to_show past that
            # means switching to `period: hour`.
            #
            # Requires a `state_class` on every entity, otherwise the series is
            # silently empty — check with `python3 scripts/ha.py stats`.
            - type: heading
              heading: Last 24 Hours
              heading_style: subtitle
              icon: mdi:circle
            - type: statistics-graph
              days_to_show: 1
              period: 5minute
              chart_type: line
              stat_types:
                - mean
              entities:
                - entity: sensor.timmerflotte_temp_hmd_sensor_temperature_4
                  name: Living Room
                - entity: sensor.timmerflotte_temp_hmd_sensor_temperature
                  name: Kitchen
                - entity: sensor.alpstuga_air_quality_monitor_temperature
                  name: Bedroom
                - entity: sensor.babyroom_babyroom_temperature
                  name: Babyroom
                - entity: sensor.timmerflotte_temp_hmd_sensor_temperature_5
                  name: Bath
                - entity: sensor.timmerflotte_temp_hmd_sensor_temperature_3
                  name: Hall
            - type: statistics-graph
              days_to_show: 1
              period: 5minute
              chart_type: line
              stat_types:
                - mean
              entities:
                - entity: sensor.timmerflotte_temp_hmd_sensor_humidity_4
                  name: Living Room
                - entity: sensor.timmerflotte_temp_hmd_sensor_humidity
                  name: Kitchen
                - entity: sensor.alpstuga_air_quality_monitor_humidity
                  name: Bedroom
                - entity: sensor.babyroom_babyroom_humidity
                  name: Babyroom
                - entity: sensor.timmerflotte_temp_hmd_sensor_humidity_5
                  name: Bath
                - entity: sensor.timmerflotte_temp_hmd_sensor_humidity_3
                  name: Hall

            # ───────────────────────── CAT FOUNTAIN ───────────────────────
            # Just the level here — stats and chart are on the Fountain view.
            - type: heading
              heading: Cat Fountain
              heading_style: title
              icon: mdi:circle
            - !include ../petlibro-water-level-card.yaml

            # ──────────────────────────── ENERGY ──────────────────────────
            # Hildebrand Glow (DCC), electricity only. Today's figures in the
            # card, then 30 days of daily totals.
            #
            # Same stat_types question as the fountain charts: HA stores
            # min/max/mean for `state_class: measurement` and sum/state/change
            # for total_increasing, never both, and asking for the wrong one
            # renders an EMPTY chart with no error. Both are listed so whichever
            # applies resolves; they are mutually exclusive, so no double bars.
            # `python3 scripts/ha.py stats` prints which applies.
            #
            # Cost rather than usage: at a single unit rate the two curves are
            # the same shape, and cost is the one that means anything. Swap the
            # entity for sensor.electricity_meter_usage_today for kWh.
            - type: heading
              heading: Energy
              heading_style: title
              icon: mdi:circle
            - !include ../energy-card.yaml
            - type: statistics-graph
              days_to_show: 30
              period: day
              chart_type: bar
              stat_types:
                - max
                - change
              entities:
                - entity: sensor.electricity_meter_cost_today
                  name: Cost per day

            # ────────────────────────── AIR QUALITY ───────────────────────
            # Carried over from dashboard-general.
            - type: heading
              heading: Air Quality
              heading_style: title
              icon: mdi:circle
            - type: sensor
              entity: sensor.alpstuga_air_quality_monitor_carbon_dioxide
              graph: line
              detail: 1
              name: { type: entity }
            - type: sensor
              entity: sensor.alpstuga_air_quality_monitor_pm2_5
              graph: line
              detail: 1
              name: { type: entity }

  # ══════════════════════════════ FOUNTAIN ════════════════════════════
  # Both cards are pulled straight from the maintained copies at the repo
  # root, so the standalone versions and this dashboard can't drift apart.
  # They need html-template-card and apexcharts-card from HACS.
  - title: Fountain
    path: fountain
    icon: mdi:circle
    type: panel
    cards:
      # mod-card wraps the stack in an ha-card we can pad, which insets every
      # card inside it. Needed because panel views render edge-to-edge, and
      # card-mod has no handling of its own for stacks or views.
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              background: none;
              border: none;
              box-shadow: none;
              padding: 0 12px;
            }
        card:
          type: vertical-stack
          cards:
            - !include ../petlibro-fountain-card.yaml
            - !include ../petlibro-fountain-chart-card.yaml

            # ───────────────────── 30-DAY DRINKING TREND ──────────────────
            # The cards above answer "now"; a sustained shift in how much a
            # cat drinks only shows up against weeks of history.
            #
            # Both sensors are cumulative-since-midnight and reset at 00:00,
            # so what is wanted is one bar per day carrying that day's total.
            #
            # Which stat_type delivers that depends on the sensor's state_class,
            # and HA never stores both:
            #   measurement      -> min/max/mean.  The day's total is its `max`.
            #   total_increasing -> sum/state/change. The day's total is `change`.
            # Asking for the wrong one renders an EMPTY chart with no error --
            # which is what `[max]` alone did here, because the Petlibro
            # integration declares its daily-mL sensors as TOTAL_INCREASING.
            #
            # Both are listed rather than just `change` so the chart survives
            # the integration changing its mind, or one of these two sensors
            # differing from the other. Because the two classes are mutually
            # exclusive, only one ever resolves -- there is no double bar.
            #
            # If a chart is STILL empty, the sensor has no state_class at all
            # and records no statistics; `python3 scripts/ha.py stats` shows
            # that as NO STATS.
            #
            # Bars rather than a line: these are discrete daily totals, not a
            # continuous signal, and a bar chart makes a single odd day
            # obvious instead of smoothing it away.
            - type: heading
              heading: Last 30 Days
              heading_style: subtitle
              icon: mdi:circle
            - type: statistics-graph
              days_to_show: 30
              period: day
              chart_type: bar
              stat_types:
                - max
                - change
              entities:
                - entity: sensor.dockstream_smart_fountain_today_s_water_consumption
                  name: Water drunk
            - type: statistics-graph
              days_to_show: 30
              period: day
              chart_type: bar
              stat_types:
                - max
                - change
              entities:
                - entity: sensor.dockstream_smart_fountain_today_s_total_drinking_times
                  name: Drinking sessions

            # ─────────────────────────── LITTER BOX ───────────────────────
            # Everything here reads binary_sensor.cat_in_litter_box, not the
            # raw Myggspray: packages/litter_box.yaml holds it on until the raw
            # sensor has been clear for 5 minutes, so one visit is one block
            # and one count. Without that package the whole section is empty.
            - type: heading
              heading: Litter Box
              heading_style: subtitle
              icon: mdi:circle
            - type: grid
              columns: 2
              square: false
              cards:
                - type: tile
                  entity: sensor.litter_box_visits_today
                  name: Visits today
                  icon: mdi:circle
                # last_changed rather than the state: "Clear" says nothing,
                # when the box was last used does. After a visit this runs
                # from the end of the 5-minute cooldown, not the exit itself.
                - type: tile
                  entity: binary_sensor.cat_in_litter_box
                  name: Last visit
                  icon: mdi:circle
                  state_content: last_changed
            # Recorder history rather than statistics, so each visit shows as
            # its own block -- and it only reaches back purge_keep_days.
            - type: history-graph
              title: Last 24 hours
              hours_to_show: 24
              entities:
                - entity: binary_sensor.cat_in_litter_box
                  name: Litter box
            # Same shape as the fountain charts above: a since-midnight total,
            # so max/change -- whichever the state_class resolves to.
            - type: statistics-graph
              days_to_show: 30
              period: day
              chart_type: bar
              stat_types:
                - max
                - change
              entities:
                - entity: sensor.litter_box_visits_today
                  name: Litter box visits

  # ══════════════════════════════ ADGUARD ═════════════════════════════
  # AdGuard Home runs as the `a0d7b954_adguard` app on this instance and is
  # the DNS server for the LAN, so anything it blocks is blocked for every
  # device — this tab is where you check that it is actually doing that.
  #
  # None of these sensors carry a `state_class`, so there are no long-term
  # statistics to plot and `statistics-graph` would render empty here. The
  # trends below use `history-graph` and `sensor` cards, which read recorder
  # history instead and therefore only reach back as far as recorder keeps it
  # (`purge_keep_days`, 10 by default).
  - title: AdGuard
    path: adguard
    icon: mdi:circle
    type: panel
    badges:
      - type: entity
        entity: sensor.adguard_home_dns_queries_blocked_ratio
        name: Blocked
        icon: mdi:circle
        color: green
      - type: entity
        entity: switch.adguard_home_protection
        name: Protection
        icon: mdi:circle
        color: red
    cards:
      # mod-card wraps the stack in an ha-card we can pad, which insets every
      # card inside it. Needed because panel views render edge-to-edge, and
      # card-mod has no handling of its own for stacks or views.
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              background: none;
              border: none;
              box-shadow: none;
              padding: 0 12px;
            }
        card:
          type: vertical-stack
          cards:
            # ──────────────────────── QUERIES & BLOCKS ────────────────────
            # Counts over AdGuard's own rolling statistics window, not since
            # midnight — see the header of adguard-card.yaml.
            - type: heading
              heading: AdGuard
              heading_style: title
              icon: mdi:circle
            - !include ../adguard-card.yaml

            # ─────────────────────────── TRENDS ───────────────────────────
            # Both series share the unit "queries", so they belong on one
            # chart: blocked is a subset of total, and the gap between the two
            # lines is the thing worth looking at. Anything measured in a
            # different unit gets its own card below rather than a second axis
            # here — history-graph draws every entity against a single scale.
            #
            # These plot the ROLLING 24-hour counters, so a flat line means a
            # steady query rate, not an idle network. A cliff means AdGuard
            # restarted and its statistics started over.
            - type: heading
              heading: Last 24 Hours
              heading_style: subtitle
              icon: mdi:circle
            - type: history-graph
              hours_to_show: 24
              entities:
                - entity: sensor.adguard_home_dns_queries
                  name: Queries
                - entity: sensor.adguard_home_dns_queries_blocked
                  name: Blocked

            # Percentage and milliseconds, one card each: the `sensor` card
            # pairs the current reading with its own mini graph, the same
            # treatment the Air Quality section on the Home view gets.
            - type: sensor
              entity: sensor.adguard_home_dns_queries_blocked_ratio
              graph: line
              detail: 1
              name: Blocked ratio
            - type: sensor
              entity: sensor.adguard_home_average_processing_speed
              graph: line
              detail: 1
              name: Average response

            # ────────────────────────── CONTROLS ──────────────────────────
            # Every switch the AdGuard integration exposes. Tapping a tile's
            # icon toggles it; tapping the body opens the more-info dialog.
            #
            # Protection is the master switch — off means AdGuard forwards
            # everything unfiltered, and the two counters above freeze. The
            # rest are AdGuard's individual protections and are safe to leave
            # as they are.
            #
            # Safe search and safe browsing are the two that surprise people:
            # safe search rewrites Google/Bing/YouTube results network-wide,
            # and safe browsing checks domains against AdGuard's malware list.
            - type: heading
              heading: Controls
              heading_style: title
              icon: mdi:circle
            - type: grid
              columns: 2
              square: false
              cards:
                - type: tile
                  entity: switch.adguard_home_protection
                  name: Protection
                  icon: mdi:circle
                - type: tile
                  entity: switch.adguard_home_filtering
                  name: Filtering
                  icon: mdi:circle
                - type: tile
                  entity: switch.adguard_home_safe_browsing
                  name: Safe browsing
                  icon: mdi:circle
                - type: tile
                  entity: switch.adguard_home_safe_search
                  name: Safe search
                  icon: mdi:circle
                - type: tile
                  entity: switch.adguard_home_parental_control
                  name: Parental control
                  icon: mdi:circle
                - type: tile
                  entity: switch.adguard_home_query_log
                  name: Query log
                  icon: mdi:circle

            # Everything AdGuard can do that HA has no entity for — filter
            # lists, per-client rules, the query log itself — lives in its own
            # UI, served through the app's ingress route. Admin users only:
            # HA hides ingress panels from non-admins, so this button lands on
            # an error page for them rather than a login prompt.
            - type: button
              name: Open AdGuard Home
              icon: mdi:circle
              show_state: false
              tap_action:
                action: navigate
                navigation_path: /hassio/ingress/a0d7b954_adguard

  # ═════════════════════════════ BUTTONS ══════════════════════════════
  # Copied from dashboard-giacomo. The two placeholder "New section"
  # headings and the trailing empty section were dropped. The buttons keep
  # their 2-across layout via a grid card, since grid_options does nothing
  # outside a sections view.
  - title: Buttons
    path: buttons
    icon: mdi:gesture-tap-button
    type: panel
    cards:
      # mod-card wraps the stack in an ha-card we can pad, which insets every
      # card inside it. Needed because panel views render edge-to-edge, and
      # card-mod has no handling of its own for stacks or views.
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              background: none;
              border: none;
              box-shadow: none;
              padding: 0 12px;
            }
        card:
          type: vertical-stack
          cards:
            - type: heading
              heading: Lights
              heading_style: title
              icon: mdi:circle
            - type: grid
              columns: 2
              square: false
              cards:
                - type: button
                  entity: switch.big_light
                  show_name: true
                  show_icon: true
                  show_state: true
                - type: button
                  entity: switch.tree
                  color: green
                  show_name: true
                  show_icon: true
                  show_state: true
                - type: button
                  entity: switch.kettelinch
                  show_name: true
                  show_icon: true
                  show_state: true
                - type: button
                  entity: switch.lampadina
                  show_name: true
                  show_icon: true
                  show_state: true
            - type: light
              entity: light.kajplats_e27_ws_globe_1521lm
            - type: light
              entity: light.kajplats_e14_ws_globe_806lm
