# The laptop dashboard: seven pages for checking and changing things at a
# desk, each a panel view holding one www/laptop-dashboard-card.js. The card
# draws its own sidebar between the pages, so open it as
# /dashboard-laptop/home?kiosk to hide HA's header too; without ?kiosk it
# opens normally, with HA's view tabs above the card.
#
# A separate dashboard from home.yaml and tablet.yaml, which stay as they are.
# The entities are in house.yaml, shared with phone.yaml.

views:
  - title: Home
    path: home
    type: panel
    cards:
      - type: custom:laptop-dashboard-card
        page: home
        house: &house !include house.yaml

  - title: Heating
    path: heating
    type: panel
    cards:
      - type: custom:laptop-dashboard-card
        page: heating
        house: *house

  - title: Cat
    path: cat
    type: panel
    cards:
      - type: custom:laptop-dashboard-card
        page: cat
        house: *house

  - title: Energy
    path: energy
    type: panel
    cards:
      - type: custom:laptop-dashboard-card
        page: energy
        house: *house

  - title: Appliances
    path: appliances
    type: panel
    cards:
      - type: custom:laptop-dashboard-card
        page: appliances
        house: *house

  - title: Network
    path: network
    type: panel
    cards:
      - type: custom:laptop-dashboard-card
        page: network
        house: *house

  - title: Lights
    path: lights
    type: panel
    cards:
      - type: custom:laptop-dashboard-card
        page: lights
        house: *house
