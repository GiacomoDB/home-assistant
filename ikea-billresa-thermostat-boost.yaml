blueprint:
  name: "Tado Thermostat Boost"
  description: "Boost Tado thermostats when button is pressed. Limited to once per day."
  domain: automation
  input:
    button:
      name: "Button"
      selector:
        entity:
          domain: event

    thermostat_1:
      name: "Thermostat 1"
      selector:
        entity:
          domain: climate

    thermostat_2:
      name: "Thermostat 2"
      selector:
        entity:
          domain: climate

    daily_limit_helper:
      name: "Daily Limit Helper"
      selector:
        entity:
          domain: input_boolean

    indicator_light:
      name: "Indicator Light"
      selector:
        entity:
          domain: light

trigger:
  - platform: state
    entity_id: !input button

condition:
  - condition: state
    entity_id: !input daily_limit_helper
    state: "off"

action:
  - service: tado.set_climate_timer
    target:
      entity_id: !input thermostat_1
    data:
      temperature: 25
      time_period: "00:15:00"

  - service: tado.set_climate_timer
    target:
      entity_id: !input thermostat_2
    data:
      temperature: 25
      time_period: "00:15:00"

  - service: input_boolean.turn_on
    target:
      entity_id: !input daily_limit_helper

  - service: light.turn_on
    target:
      entity_id: !input indicator_light

  - delay:
      seconds: 2

  - service: light.turn_off
    target:
      entity_id: !input indicator_light

mode: single
