blueprint:
  name: "Tado Thermostat Boost"
  description: >-
    Boost the heating when the button is pressed. Limited to once per day.
    Starts the boost timer from packages/heating.yaml: the heating controller
    sends 25 °C to tado over HomeKit (local, no cloud quota) while it runs, then
    goes back to the schedule.
  domain: automation
  input:
    button:
      name: "Button"
      selector:
        entity:
          domain: event

    boost_timer:
      name: "Boost Timer"
      description: "timer.heating_boost, from packages/heating.yaml"
      default: timer.heating_boost
      selector:
        entity:
          domain: timer

    boost_minutes:
      name: "Boost Duration"
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: min

    daily_limit_helper:
      name: "Daily Limit Helper"
      selector:
        entity:
          domain: input_boolean

    indicator_light:
      name: "Indicator Light"
      selector:
        entity:
          domain: light

variables:
  boost_minutes: !input boost_minutes

# Not on unavailable/unknown: a remote dropping out and coming back is a state
# change too, and would boost without a press.
trigger:
  - platform: state
    entity_id: !input button
    not_from: ["unavailable", "unknown"]
    not_to: ["unavailable", "unknown"]

condition:
  - condition: state
    entity_id: !input daily_limit_helper
    state: "off"

action:
  - service: timer.start
    target:
      entity_id: !input boost_timer
    data:
      # Seconds; timer.start accepts a plain number.
      duration: "{{ boost_minutes | int * 60 }}"

  - service: input_boolean.turn_on
    target:
      entity_id: !input daily_limit_helper

  - service: light.turn_on
    target:
      entity_id: !input indicator_light

  - delay:
      seconds: 2

  - service: light.turn_off
    target:
      entity_id: !input indicator_light

mode: single
