# Appliances: the numbers behind the Appliances view in dashboards/home.yaml.
# Read-only -- nothing here controls a device. The one action is reloading the
# SmartThings integration when its connection goes silent (end of file).
#
# WHAT SAMSUNG SMARTTHINGS GIVES (checked 2026-10-15)
# Washer and dryer: a machine state (run / pause / stop), a job state (the
# phase: wash, rinse, spin, finish / drying, cooling, finished), a completion
# time, and a lifetime energy counter in 0.1 kWh steps that reports about every
# 15 minutes. The energy counters have long-term statistics back to 2025-12,
# so the dashboard's energy charts work straight away. Power always reads 0 W
# and there is no programme name, so neither appears anywhere.
# Vacuum: movement (charging, homing, cleaning, alarm...), battery, dust bag
# and an energy counter, which mostly measures the dock: about 0.13 kWh a day.
#
# WHAT THIS FILE ADDS
# - A one-line status per device, for the top of the view.
# - Cycle counters (washes, dries, vacuum runs) with `state_class:
#   total_increasing`, so they get long-term statistics and the dashboard can
#   chart them per week and month. SmartThings has no counter of its own, so
#   these start at 0 on the day this file is installed. A cycle already
#   running at that moment is counted when it finishes, but has no length or
#   energy: its start was never seen.
# - The last wash's and dry's length and energy.
# - A watchdog that reloads SmartThings after an hour with no update at all.
#
# WHAT COUNTS AS A CYCLE
# A cycle STARTS when the machine state goes to run from stop. Resuming from a
# pause, or coming back from unavailable after a restart or a cloud blip, is
# the same cycle. A cycle is COUNTED when the job state reaches finish(ed),
# so a cancelled programme is not counted. The cloud does drop the odd event
# (a wash on 2026-10-10 never reported its end), so expect a rare miss.
#
# LAST CYCLE'S ENERGY
# The counter's start value is recorded when the cycle starts. The difference
# is taken 30 minutes after the machine stops, once the counter has caught up,
# or at the next start if that comes first. The counter moves in 0.1 kWh
# steps, so a short wash can read 0.0 or 0.1; treat it as approximate.
#
# Trigger-based template sensors keep their state and attributes across
# restarts, which is what lets the counters and the start values survive one.

template:
  # ─────────────────────────────── WASHER ───────────────────────────────
  - triggers:
      - trigger: state
        entity_id: sensor.washing_machine_machine_state
        to: run
        id: start
      - trigger: state
        entity_id: sensor.washing_machine_job_state
        to: [finish, finished]
        id: finish
      - trigger: state
        entity_id: sensor.washing_machine_machine_state
        to: stop
        for:
          minutes: 30
        id: settled
      # Re-render on start and on template reload, with no other effect: a
      # trigger-based sensor stays `unknown` until its first trigger, and an
      # unknown counter records no statistics, so the counters would have no
      # history until the first finished cycle.
      - trigger: homeassistant
        event: start
        id: boot
      - trigger: event
        event_type: event_template_reloaded
        id: boot
    variables:
      energy: "{{ states('sensor.washing_machine_energy') }}"
      # Only a run from stop is a new cycle; see WHAT COUNTS AS A CYCLE.
      new_cycle: >-
        {{ trigger.id == 'start' and trigger.from_state is not none
           and trigger.from_state.state not in ['run', 'pause', 'unavailable', 'unknown'] }}
      finished: >-
        {{ trigger.id == 'finish' and trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown'] }}
    sensor:
      - name: Washing machine cycles
        unique_id: washing_machine_cycles
        unit_of_measurement: cycles
        state_class: total_increasing
        icon: mdi:circle
        state: "{{ this.state | int(0) + (1 if finished else 0) }}"

      - name: Washing machine last cycle
        unique_id: washing_machine_last_cycle
        unit_of_measurement: min
        device_class: duration
        icon: mdi:circle
        state: >-
          {% set started = this.attributes.get('started') %}
          {% if finished %}
            {{ (((as_timestamp(now()) - as_timestamp(started)) / 60) | round(0) | int)
               if started else none }}
          {% else %}
            {{ this.state if this.state | is_number else none }}
          {% endif %}
        attributes:
          # Cleared at each finish, so a cycle whose start was missed can't
          # be timed from an older cycle's start.
          started: >-
            {{ now().isoformat() if new_cycle
               else (none if finished else this.attributes.get('started')) }}
          # When it finished. The dashboard shows this, not last_changed,
          # which a reload or a restart also moves.
          finished: "{{ now().isoformat() if finished else this.attributes.get('finished') }}"

      - name: Washing machine last cycle energy
        unique_id: washing_machine_last_cycle_energy
        unit_of_measurement: kWh
        icon: mdi:circle
        state: >-
          {% set e0 = this.attributes.get('energy_start') %}
          {% if (trigger.id == 'settled' or new_cycle) and this.attributes.get('open')
                and energy | is_number and e0 is number %}
            {{ (energy | float - e0) | round(1) }}
          {% else %}
            {{ this.state if this.state | is_number else none }}
          {% endif %}
        attributes:
          energy_start: >-
            {{ (energy | float(none)) if new_cycle else this.attributes.get('energy_start') }}
          open: >-
            {{ true if new_cycle else (false if trigger.id == 'settled' else this.attributes.get('open', false)) }}

  # ─────────────────────────────── DRYER ────────────────────────────────
  # Same as the washer, entity for entity.
  - triggers:
      - trigger: state
        entity_id: sensor.tumble_dryer_machine_state
        to: run
        id: start
      - trigger: state
        entity_id: sensor.tumble_dryer_job_state
        to: [finish, finished]
        id: finish
      - trigger: state
        entity_id: sensor.tumble_dryer_machine_state
        to: stop
        for:
          minutes: 30
        id: settled
      # Start and template reload: see the washer's.
      - trigger: homeassistant
        event: start
        id: boot
      - trigger: event
        event_type: event_template_reloaded
        id: boot
    variables:
      energy: "{{ states('sensor.tumble_dryer_energy') }}"
      new_cycle: >-
        {{ trigger.id == 'start' and trigger.from_state is not none
           and trigger.from_state.state not in ['run', 'pause', 'unavailable', 'unknown'] }}
      finished: >-
        {{ trigger.id == 'finish' and trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown'] }}
    sensor:
      - name: Tumble dryer cycles
        unique_id: tumble_dryer_cycles
        unit_of_measurement: cycles
        state_class: total_increasing
        icon: mdi:circle
        state: "{{ this.state | int(0) + (1 if finished else 0) }}"

      - name: Tumble dryer last cycle
        unique_id: tumble_dryer_last_cycle
        unit_of_measurement: min
        device_class: duration
        icon: mdi:circle
        state: >-
          {% set started = this.attributes.get('started') %}
          {% if finished %}
            {{ (((as_timestamp(now()) - as_timestamp(started)) / 60) | round(0) | int)
               if started else none }}
          {% else %}
            {{ this.state if this.state | is_number else none }}
          {% endif %}
        attributes:
          # Cleared at each finish, so a cycle whose start was missed can't
          # be timed from an older cycle's start.
          started: >-
            {{ now().isoformat() if new_cycle
               else (none if finished else this.attributes.get('started')) }}
          # When it finished. The dashboard shows this, not last_changed,
          # which a reload or a restart also moves.
          finished: "{{ now().isoformat() if finished else this.attributes.get('finished') }}"

      - name: Tumble dryer last cycle energy
        unique_id: tumble_dryer_last_cycle_energy
        unit_of_measurement: kWh
        icon: mdi:circle
        state: >-
          {% set e0 = this.attributes.get('energy_start') %}
          {% if (trigger.id == 'settled' or new_cycle) and this.attributes.get('open')
                and energy | is_number and e0 is number %}
            {{ (energy | float - e0) | round(1) }}
          {% else %}
            {{ this.state if this.state | is_number else none }}
          {% endif %}
        attributes:
          energy_start: >-
            {{ (energy | float(none)) if new_cycle else this.attributes.get('energy_start') }}
          open: >-
            {{ true if new_cycle else (false if trigger.id == 'settled' else this.attributes.get('open', false)) }}

  # ─────────────────────────────── VACUUM ───────────────────────────────
  # One run per start of cleaning. While docked the vacuum entity reads
  # `unknown`, so that counts as a valid "from"; resuming from paused, or
  # reappearing after a restart, does not.
  - triggers:
      - trigger: state
        entity_id: vacuum.robot_vacuum
        to: cleaning
        id: run
      # Start and template reload: see the washer's.
      - trigger: homeassistant
        event: start
        id: boot
      - trigger: event
        event_type: event_template_reloaded
        id: boot
    variables:
      new_run: >-
        {{ trigger.id == 'run' and trigger.from_state is not none
           and trigger.from_state.state not in ['cleaning', 'paused', 'unavailable'] }}
    sensor:
      - name: Robot vacuum runs
        unique_id: robot_vacuum_runs
        unit_of_measurement: runs
        state_class: total_increasing
        icon: mdi:circle
        state: "{{ this.state | int(0) + (1 if new_run else 0) }}"
        attributes:
          last_run: "{{ now().isoformat() if new_run else this.attributes.get('last_run') }}"

  # ─────────────────────────────── STATUS ───────────────────────────────
  # One readable line per device for the dashboard. Unknown phases fall back
  # to the raw value with underscores turned into spaces.
  - sensor:
      - name: Washing machine status
        unique_id: washing_machine_status
        icon: mdi:circle
        state: >-
          {% set m = states('sensor.washing_machine_machine_state') %}
          {% set j = states('sensor.washing_machine_job_state') %}
          {% set end = as_datetime(states('sensor.washing_machine_completion_time'), none) %}
          {% set names = {'none': 'Starting', 'weight_sensing': 'Weighing the load',
                          'wash': 'Washing', 'rinse': 'Rinsing', 'spin': 'Spinning',
                          'finish': 'Finished', 'finished': 'Finished',
                          'drying': 'Drying', 'cooling': 'Cooling down',
                          'wrinkle_prevent': 'Wrinkle prevent'} %}
          {%- if m == 'run' -%}
            {{ names.get(j, j | replace('_', ' ') | capitalize) }}
            {%- if end and end > now() %} · done at {{ as_local(end).strftime('%H:%M') }}{% endif %}
          {%- elif m == 'pause' -%}
            Paused
          {%- elif m in ['unavailable', 'unknown'] -%}
            Offline
          {%- else -%}
            Idle
          {%- endif -%}

      # Same as the washer's, with the dryer's entities.
      - name: Tumble dryer status
        unique_id: tumble_dryer_status
        icon: mdi:circle
        state: >-
          {% set m = states('sensor.tumble_dryer_machine_state') %}
          {% set j = states('sensor.tumble_dryer_job_state') %}
          {% set end = as_datetime(states('sensor.tumble_dryer_completion_time'), none) %}
          {% set names = {'none': 'Starting', 'weight_sensing': 'Weighing the load',
                          'wash': 'Washing', 'rinse': 'Rinsing', 'spin': 'Spinning',
                          'finish': 'Finished', 'finished': 'Finished',
                          'drying': 'Drying', 'cooling': 'Cooling down',
                          'wrinkle_prevent': 'Wrinkle prevent'} %}
          {%- if m == 'run' -%}
            {{ names.get(j, j | replace('_', ' ') | capitalize) }}
            {%- if end and end > now() %} · done at {{ as_local(end).strftime('%H:%M') }}{% endif %}
          {%- elif m == 'pause' -%}
            Paused
          {%- elif m in ['unavailable', 'unknown'] -%}
            Offline
          {%- else -%}
            Idle
          {%- endif -%}

      - name: Robot vacuum status
        unique_id: robot_vacuum_status
        icon: mdi:circle
        state: >-
          {% set mv = states('sensor.robot_vacuum_movement') %}
          {% set names = {'charging': 'Docked, charging', 'idle': 'Idle',
                          'cleaning': 'Cleaning', 'point': 'Spot cleaning',
                          'homing': 'Returning to the dock', 'alarm': 'Needs attention',
                          'pause': 'Paused', 'off': 'Off', 'reserve': 'Scheduled'} %}
          {% set battery = states('sensor.robot_vacuum_battery') %}
          {%- if mv in ['unavailable', 'unknown'] -%}
            Offline
          {%- else -%}
            {{ names.get(mv, mv | replace('_', ' ') | capitalize) }}
            {%- if battery | is_number %} · {{ battery }}%{% endif %}
            {%- if is_state('binary_sensor.robot_vacuum_dust_bag_full', 'on') %} · dust bag full{% endif %}
          {%- endif -%}

  # ───────────────────────────── LAST CYCLE ─────────────────────────────
  # The last cycle in one line, e.g. "83 min · 0.4 kWh · 2 days ago", so the
  # dashboard shows it in one row without truncating. The energy appears once
  # it's measured, 30 minutes after the machine stops. "ago" counts from the
  # `finished` attribute, not last_changed: a reload or restart moves that,
  # which is how the vacuum showed a "last run" it never made. These use
  # now(), so they re-render every minute.
  - sensor:
      - name: Washing machine last cycle summary
        unique_id: washing_machine_last_cycle_summary
        icon: mdi:circle
        state: >-
          {% set d = states('sensor.washing_machine_last_cycle') %}
          {% set e = states('sensor.washing_machine_last_cycle_energy') %}
          {% set f = state_attr('sensor.washing_machine_last_cycle', 'finished') %}
          {% set ns = namespace(parts=[]) %}
          {% if d | is_number %}{% set ns.parts = ns.parts + [d ~ ' min'] %}{% endif %}
          {% if d | is_number and e | is_number
                and not state_attr('sensor.washing_machine_last_cycle_energy', 'open') %}
            {% set ns.parts = ns.parts + [e ~ ' kWh'] %}
          {% endif %}
          {% if as_datetime(f, none) %}
            {% set ns.parts = ns.parts + [time_since(as_datetime(f)) ~ ' ago'] %}
          {% endif %}
          {{ ns.parts | join(' · ') if ns.parts else 'Not recorded yet' }}

      - name: Tumble dryer last cycle summary
        unique_id: tumble_dryer_last_cycle_summary
        icon: mdi:circle
        state: >-
          {% set d = states('sensor.tumble_dryer_last_cycle') %}
          {% set e = states('sensor.tumble_dryer_last_cycle_energy') %}
          {% set f = state_attr('sensor.tumble_dryer_last_cycle', 'finished') %}
          {% set ns = namespace(parts=[]) %}
          {% if d | is_number %}{% set ns.parts = ns.parts + [d ~ ' min'] %}{% endif %}
          {% if d | is_number and e | is_number
                and not state_attr('sensor.tumble_dryer_last_cycle_energy', 'open') %}
            {% set ns.parts = ns.parts + [e ~ ' kWh'] %}
          {% endif %}
          {% if as_datetime(f, none) %}
            {% set ns.parts = ns.parts + [time_since(as_datetime(f)) ~ ' ago'] %}
          {% endif %}
          {{ ns.parts | join(' · ') if ns.parts else 'Not recorded yet' }}

      - name: Robot vacuum last run
        unique_id: robot_vacuum_last_run
        icon: mdi:circle
        state: >-
          {% set t = as_datetime(state_attr('sensor.robot_vacuum_runs', 'last_run'), none) %}
          {{ (time_since(t) ~ ' ago') if t else 'No run yet' }}

automation:
  # SmartThings pushes changes over one long-lived cloud connection and never
  # polls. That connection dies silently now and then -- five times between
  # 2026-10-09 and 2026-10-19, for 8 to 43 hours each, with the integration
  # still "loaded" -- and nothing refreshes until it's reloaded. While it's
  # alive, the vacuum dock's energy counter alone reports every 15 minutes, so
  # an hour with nothing from any SmartThings entity means the connection is
  # gone, not that the house is quiet. At most one reload an hour, so a Samsung
  # outage doesn't turn into a reload loop. Each reload is in the logbook.
  #
  # A reload makes the entities briefly unavailable; the cycle counters above
  # already treat coming back from unavailable as the same cycle.
  - id: smartthings_reload_when_silent
    alias: "SmartThings: reload when silent"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: /15
    conditions:
      - condition: template
        value_template: >-
          {% set heard = expand(integration_entities('smartthings'))
               | map(attribute='last_reported') | list %}
          {{ heard | count > 0 and (now() - heard | max).total_seconds() > 3600 }}
      - condition: template
        value_template: >-
          {% set last = this.attributes.get('last_triggered') %}
          {{ last is none or (now() - last).total_seconds() > 3600 }}
    actions:
      - action: logbook.log
        data:
          name: SmartThings
          message: >-
            silent since {{ (expand(integration_entities('smartthings'))
              | map(attribute='last_reported') | max).astimezone().strftime('%a %H:%M') }}; reloading
      - action: homeassistant.reload_config_entry
        target:
          entity_id: sensor.robot_vacuum_energy
