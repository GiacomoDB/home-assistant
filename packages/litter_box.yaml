# Litter box visits -- the helpers behind the Litter Box section of the Fountain
# view in dashboards/home.yaml.
#
# The occupancy sensor next to the box only says "occupied" or "clear". A
# dashboard can draw that as a timeline, but it cannot count it: statistics-graph
# needs a numeric sensor with long-term statistics, and a binary_sensor has none.
# The history_stats sensor below turns the day's visits into a number, which
# gets a state_class and therefore daily totals kept indefinitely.
#
# Like the fountain's `today_s_...` sensors it is cumulative since midnight and
# resets at 00:00, so the day's total is its daily `max` -- see the 30-day chart
# comments in dashboards/home.yaml.
#
# ONE VISIT, ONE COUNT
# A cat holds still while doing its business, long enough for the Myggspray to
# drop to clear mid-visit and re-trigger on the digging or the exit. Counting
# the raw sensor would score one visit two or three times. So the count reads
# `binary_sensor.cat_in_litter_box` instead: on with the first trigger, and off
# only once the raw sensor has been clear for 5 minutes. Re-triggers inside that
# window extend the same visit. The trade-off is that two genuine visits under
# 5 minutes apart count as one, which with one cat is rare.
#
# Changing the window: edit `delay_off` below, then push with --restart.

template:
  - binary_sensor:
      - name: Cat in litter box
        unique_id: cat_in_litter_box
        device_class: occupancy
        state: "{{ is_state('binary_sensor.myggspray_wrlss_mtn_sensor_occupancy', 'on') }}"
        delay_off:
          minutes: 5

sensor:
  - platform: history_stats
    name: Litter box visits today
    unique_id: litter_box_visits_today
    entity_id: binary_sensor.cat_in_litter_box
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"
