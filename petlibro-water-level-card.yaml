# Simple at-a-glance water level for the Petlibro / Dockstream fountain.
#
# Deliberately minimal: the number, a status word and a bar. The detailed
# consumption stats live in petlibro-fountain-card.yaml.
#
# Requires html-template-card (HACS). Thresholds match the ones in
# petlibro-fountain-card.yaml — keep them in sync.

type: custom:html-template-card
title: ""
ignore_line_breaks: true
content: >
  {% set pct = states('sensor.dockstream_smart_fountain_remaining_water_2') |
  float(0) %}

  {% if pct > 50 %}
    {% set color = '#38b6ff' %}
    {% set status = 'Good' %}
  {% elif pct > 25 %}
    {% set color = '#fbbf24' %}
    {% set status = 'Top up soon' %}
  {% else %}
    {% set color = '#f87171' %}
    {% set status = 'Refill now' %}
  {% endif %}

  <style>
    /* Scoped with :has() and NOT written as a bare `ha-card` selector.
       hui-card opts out of shadow DOM (createRenderRoot returns `this`), so every
       card in a stack renders into the STACK's shadow tree -- and html-template-card
       has no shadow root either, putting this <style> and this card's <ha-card> in
       that shared tree. A bare `ha-card` rule therefore hits every sibling card that
       also lacks its own shadow root, i.e. every other html-template-card on the
       view. Cards built as normal LitElements are immune, which is what makes the
       leak so easy to miss. `:has(.wl-card)` can only ever match this card. */
    ha-card:has(.wl-card) { background: none !important; box-shadow: none !important; border: none !important; }

    .wl-card {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--ha-card-background, var(--card-background-color, #fff));
      border: 1px solid var(--divider-color, #e0e0e0);
      border-radius: 16px;
      padding: 18px 20px 20px;
    }

    .wl-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .wl-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--secondary-text-color, #727272);
    }

    /* Status pill carries the colour, so the level reads without the bar. */
    .wl-status {
      font-size: 12px;
      font-weight: 600;
      color: {{ color }};
      background: {{ color }}22;
      padding: 3px 11px;
      border-radius: 999px;
    }

    .wl-value {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1.5px;
      color: var(--primary-text-color, #212121);
    }

    .wl-value span {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--secondary-text-color, #727272);
      margin-left: 3px;
    }

    .wl-track {
      height: 10px;
      border-radius: 6px;
      background: var(--secondary-background-color, #eeeeee);
      margin-top: 14px;
      overflow: hidden;
    }

    .wl-fill {
      height: 100%;
      border-radius: 6px;
      width: {{ pct }}%;
      background: linear-gradient(90deg, {{ color }}aa, {{ color }});
      transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>


  <div class="wl-card">
    <div class="wl-top">
      <span class="wl-label">Water Level</span>
      <span class="wl-status">{{ status }}</span>
    </div>
    <div class="wl-value">{{ pct | round(0) | int }}<span>%</span></div>
    <div class="wl-track"><div class="wl-fill"></div></div>
  </div>
